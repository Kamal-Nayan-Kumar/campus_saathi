<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Saathi — Student Portal</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --panel: #ffffff;
      --ink: #1c2333;
      --muted: #6b7280;
      --accent: #2f5fe0;
      --accent-dark: #1e46b4;
      --bot-bubble: #eef1fa;
      --user-bubble: #2f5fe0;
      --error: #b91c1c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .chat-app {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid #e5e7eb;
      padding: 16px 20px;
    }
    header h1 { font-size: 1.15rem; }
    header p { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }
    #thread {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 0.95rem;
    }
    .bot {
      align-self: flex-start;
      background: var(--bot-bubble);
      border-bottom-left-radius: 4px;
    }
    .user {
      align-self: flex-end;
      background: var(--user-bubble);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .thinking {
      align-self: flex-start;
      color: var(--muted);
      font-style: italic;
      font-size: 0.9rem;
      padding: 6px 4px;
    }
    .error-msg {
      align-self: center;
      color: var(--error);
      background: #fef2f2;
      border: 1px solid #fecaca;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
    }
    form {
      display: flex;
      gap: 8px;
      padding: 14px 20px;
      background: var(--panel);
      border-top: 1px solid #e5e7eb;
    }
    #question {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
    }
    #question:focus { border-color: var(--accent); }
    button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: var(--accent-dark); }
    button:disabled { opacity: 0.55; cursor: wait; }
    .hint {
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
      padding-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="chat-app">
    <header>
      <h1>🎓 Campus Saathi</h1>
      <p>Ask anything about campus — in any language.</p>
    </header>
    <div id="thread" aria-live="polite"></div>
    <form id="chat-form">
      <input id="question" type="text" placeholder="Type your question…" autocomplete="off" required>
      <button type="submit" id="send-btn">Send</button>
    </form>
    <p class="hint">Answers are generated from ingested college documents.</p>
  </div>

  <script>
    const thread = document.getElementById("thread");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("question");
    const sendBtn = document.getElementById("send-btn");

    function addBubble(text, cls) {
      const div = document.createElement("div");
      div.className = "bubble " + cls;
      div.textContent = text;
      thread.appendChild(div);
      thread.scrollTop = thread.scrollHeight;
      return div;
    }

    function addThinking() {
      const div = document.createElement("div");
      div.className = "thinking";
      div.id = "thinking";
      div.textContent = "Thinking…";
      thread.appendChild(div);
      thread.scrollTop = thread.scrollHeight;
      return div;
    }

    function addError(text) {
      const div = document.createElement("div");
      div.className = "error-msg";
      div.textContent = text;
      thread.appendChild(div);
      thread.scrollTop = thread.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      addBubble(question, "user");
      input.value = "";
      sendBtn.disabled = true;
      const thinking = addThinking();

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: question }),
        });
        thinking.remove();
        if (!res.ok) throw new Error("Server returned " + res.status);
        const data = await res.json();
        addBubble(data.answer, "bot");
      } catch (err) {
        thinking.remove();
        addError("Could not reach the assistant. Please check your connection and try again.");
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
