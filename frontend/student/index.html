<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Saathi — Student Portal</title>
  <link rel="icon" type="image/png" href="cs_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --slate: #20372F;
      --slate-soft: #2C463C;
      --paper: #FAF9F4;
      --card: #FFFFFF;
      --ink: #24312B;
      --muted: #6E7A72;
      --line: #DFE4DB;
      --marigold: #E9A13B;
      --error-bg: #FBEDEA;
      --error-ink: #8C3B2E;
      --font-display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
      --font-body: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font-body);
      background: var(--paper);
      color: var(--ink);
      display: flex;
      flex-direction: column;
    }

    /* Slate chalkboard header — full bleed */
    .board {
      background: var(--slate);
      color: var(--paper);
      padding: 18px 24px 16px;
    }
    .board-inner, .thread-inner, .composer {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }
    .board-inner { text-align: center; }
    .board .brand { justify-content: center; }
    .brand {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.35rem;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--marigold);
      flex: none;
    }
    .board .tagline {
      margin-top: 4px;
      font-size: 0.88rem;
      color: rgba(250, 249, 244, 0.72);
    }

    /* Thread */
    #thread-outer {
      flex: 1;
      overflow-y: auto;
      background-image: radial-gradient(var(--line) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    #thread {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 24px;
      min-height: 100%;
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
    }
    .bubble {
      max-width: 82%;
      padding: 11px 15px;
      font-size: 0.95rem;
      line-height: 1.55;
      word-wrap: break-word;
      animation: rise 0.18s ease-out;
    }
    .bubble.bot p { margin: 0.4em 0; }
    .bubble.bot p:first-child { margin-top: 0; }
    .bubble.bot p:last-child { margin-bottom: 0; }
    .bubble.bot strong { font-weight: 600; }
    .bubble.bot ul, .bubble.bot ol { margin: 0.5em 0 0.5em 1.2em; }
    .bubble.bot table { border-collapse: collapse; width: 100%; margin: 0.6em 0; font-size: 0.9em; }
    .bubble.bot th, .bubble.bot td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; }
    .bubble.bot th { background: var(--paper); font-weight: 600; }
    .bubble.bot code { background: var(--paper); padding: 1px 4px; border-radius: 4px; font-size: 0.88em; }
    .bubble.bot pre { background: var(--paper); padding: 10px; border-radius: 8px; overflow-x: auto; margin: 0.6em 0; }
    .bot {
      align-self: flex-start;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px 14px 14px 4px;
      box-shadow: 0 1px 2px rgba(36, 49, 43, 0.05);
    }
    .user {
      align-self: flex-end;
      background: var(--slate);
      color: var(--paper);
      border-radius: 14px 14px 4px 14px;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .thinking {
      align-self: flex-start;
      padding: 11px 15px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .thinking::after {
      content: "";
      display: inline-block;
      width: 1.4em;
      text-align: left;
      animation: dots 1.2s steps(4) infinite;
    }
    @keyframes dots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75% { content: "..."; }
    }
    .error-msg {
      align-self: center;
      background: var(--error-bg);
      color: var(--error-ink);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 0.88rem;
    }

    /* Source tag at bottom of bot bubble */
    .source-tag {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 0.78rem;
      color: var(--muted);
      background: var(--paper);
      cursor: default;
      font-family: var(--font-mono);
      letter-spacing: 0.01em;
    }
    .source-tag .source-label {
      color: var(--ink);
      font-weight: 600;
    }
    .source-wrap {
      margin-top: 8px;
    }
    .source-tag[onclick] {
      cursor: pointer;
    }
    .source-detail {
      margin-top: 6px;
      padding: 6px 10px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 0.8rem;
      color: var(--muted);
      font-family: var(--font-mono);
      line-height: 1.5;
    }

    /* Empty state */
    .empty-state {
      margin: auto;
      text-align: center;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .empty-state .hero-cover {
      width: min(440px, 92vw);
      height: auto;
      max-width: 100%;
      border-radius: 0;
      object-fit: contain;
      object-position: center;
      border: none;
      box-shadow: none;
      margin-bottom: 22px;
      background: transparent;
      display: block;
      padding: 0;
    }
    .empty-state p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 16px;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .chip {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 999px;
      padding: 8px 15px;
      font: inherit;
      font-size: 0.86rem;
      color: var(--ink);
      cursor: pointer;
    }
    .chip:hover { border-color: var(--slate); }

    /* Composer — full bleed white bar */
    footer {
      background: var(--card);
      border-top: 1px solid var(--line);
      padding: 14px 24px 12px;
    }
    form { display: flex; gap: 8px; }
    #question {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font: inherit;
      font-size: 0.98rem;
      background: var(--paper);
      outline: none;
    }
    #question:focus-visible, button:focus-visible, .chip:focus-visible {
      outline: 2px solid var(--marigold);
      outline-offset: 2px;
    }
    button[type="submit"] {
      padding: 12px 22px;
      border: none;
      border-radius: 999px;
      background: var(--slate);
      color: var(--paper);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button[type="submit"]:hover { background: var(--slate-soft); }
    button:disabled { opacity: 0.55; cursor: wait; }
    .hint {
      margin-top: 8px;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    @media (max-width: 520px) {
      .board { padding: 16px 18px 14px; }
      #thread { padding: 16px; }
      .bubble { max-width: 90%; }
      footer { padding: 12px 14px 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bubble { animation: none; }
    }
  </style>
</head>
<body>
  <header class="board">
    <div class="board-inner" style="display:flex; align-items:center; gap:14px; text-align:left; justify-content:flex-start;">
      <img src="cs_logo.png" alt="Campus Saathi" style="width:54px; height:54px; border-radius:12px; object-fit:contain; flex:none; display:block;">
      <div>
        <div style="font-family:var(--font-display); font-weight:700; font-size:1.28rem; letter-spacing:-0.01em; line-height:1; color:var(--paper);">Campus <span style="color:var(--marigold);">Saathi</span></div>
        <div style="font-size:0.82rem; color:rgba(250,249,244,0.72); margin-top:3px;">Ask about campus — in any language.</div>
      </div>
    </div>
  </header>

  <div id="thread-outer">
    <main id="thread">
      <div class="empty-state" id="empty-state">
        <img src="cover.png" alt="Campus Saathi — Your AI Campus Assistant" class="hero-cover">
        <p>Ask your first question — try one of these:</p>
        <div class="chips">
          <button type="button" class="chip">What is the fee for 3rd semester?</button>
          <button type="button" class="chip">What is in dinner today?</button>
          <button type="button" class="chip">When is the next bus from campus?</button>
        </div>
      </div>
    </main>
  </div>

  <footer>
    <div class="composer">
      <form id="chat-form">
        <input id="question" type="text" placeholder="Ask a question…" autocomplete="off" required>
        <button type="submit" id="send-btn">Send</button>
      </form>
      <p class="hint">ANSWERS COME FROM INGESTED COLLEGE DOCUMENTS</p>
    </div>
  </footer>

  <script>
    const thread = document.getElementById("thread");
    const emptyState = document.getElementById("empty-state");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("question");
    const sendBtn = document.getElementById("send-btn");
    const STORAGE_KEY = "campus_saathi_history_v1";
    const MAX_HISTORY = 5; // last 5 Q&A pairs sent to AI for context

    function loadHistory() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function saveHistory(turns) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(turns));
      } catch {
        // localStorage may be full or disabled; fail silently
      }
    }

    function appendTurn(turn) {
      const turns = loadHistory();
      turns.push(turn);
      // Keep only the last MAX_HISTORY * 2 entries (each pair = user + assistant)
      const trimmed = turns.slice(-MAX_HISTORY * 2);
      saveHistory(trimmed);
    }

    document.querySelectorAll(".chip").forEach(chip => {
      chip.addEventListener("click", () => {
        input.value = chip.textContent;
        input.focus();
      });
    });

    function addBubble(text, cls, sources) {
      if (emptyState && emptyState.parentNode) emptyState.remove();
      const div = document.createElement("div");
      div.className = "bubble " + cls;
      if (cls === "bot") {
        let html = marked.parse(text);
        if (sources && sources.length > 0) {
          html += renderSourceTag(sources);
        }
        div.innerHTML = html;
      } else {
        div.textContent = text;
      }
      thread.appendChild(div);
      document.getElementById("thread-outer").scrollTop = document.getElementById("thread-outer").scrollHeight;
      return div;
    }

    function renderSourceTag(sources) {
      const isMobile = window.innerWidth <= 520;
      // "Source:" black, filename muted
      const sourceLabel = '<span class="source-label">Source:</span>';
      const sourcesLabel = '<span class="source-label">Sources (' + sources.length + '):</span>';
      // On mobile, collapse by default; on desktop, show all at once
      if (isMobile) {
        return (
          '<div class="source-wrap">' +
          '<span class="source-tag" onclick="toggleSource(this)">📄 ' +
          '<span class="source-label">Tap</span> to see ' + sources.length + ' sources' +
          ' ▼</span>' +
          '<div class="source-detail" style="display:none">' +
          sources.map(s => '<span class="source-label">•</span> ' + escapeHtml(s)).join("<br>") +
          '</div></div>'
        );
      }
      if (sources.length === 1) {
        return (
          '<div class="source-tag">📄 ' + sourceLabel + ' ' +
          '<span>' + escapeHtml(sources[0]) + '</span></div>'
        );
      }
      return (
        '<div class="source-tag">📄 ' + sourcesLabel + ' ' +
        sources.map(s => '<span>' + escapeHtml(s) + '</span>').join(", ") +
        '</div>'
      );
    }

    function toggleSource(tag) {
      const detail = tag.nextElementSibling;
      if (!detail) return;
      if (detail.style.display === "none") {
        detail.style.display = "block";
        tag.innerHTML = tag.innerHTML.replace(" ▼", " ▲");
      } else {
        detail.style.display = "none";
        tag.innerHTML = tag.innerHTML.replace(" ▲", " ▼");
      }
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function addThinking() {
      const div = document.createElement("div");
      div.className = "thinking";
      div.id = "thinking";
      div.textContent = "Thinking";
      thread.appendChild(div);
      const outer = document.getElementById("thread-outer");
      outer.scrollTop = outer.scrollHeight;
      return div;
    }

    function addError(text) {
      const div = document.createElement("div");
      div.className = "error-msg";
      div.textContent = text;
      thread.appendChild(div);
      const outer = document.getElementById("thread-outer");
      outer.scrollTop = outer.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      addBubble(question, "user");
      input.value = "";
      sendBtn.disabled = true;
      const thinking = addThinking();

      try {
        // Send last 5 Q&A pairs as conversation context
        const history = loadHistory();
        // Format as [{role:"user",content:...}, {role:"assistant",content:...}, ...]
        // We only need the last 5 pairs = 10 entries max; trim to last 10
        const historyPayload = history.slice(-10);

        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: question, history: historyPayload }),
        });
        thinking.remove();
        if (!res.ok) throw new Error("Server returned " + res.status);
        const data = await res.json();
        addBubble(data.answer, "bot", data.sources || []);
        // Save this Q&A pair to local history
        appendTurn({ role: "user", content: question });
        appendTurn({ role: "assistant", content: data.answer });
      } catch (err) {
        thinking.remove();
        addError("Can't reach the assistant right now. Check your connection and try again.");
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
